apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ledger-api-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Omprakash458/gitops-manifests.git'
    targetRevision: HEAD
    path: '.'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
