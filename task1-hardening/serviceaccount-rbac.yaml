---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-api-sa
  namespace: production
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ledger-api-role
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ledger-api-rb
  namespace: production
subjects:
  - kind: ServiceAccount
    name: ledger-api-sa
    namespace: production
roleRef:
  kind: Role
  name: ledger-api-role
  apiGroup: rbac.authorization.k8s.io
  
