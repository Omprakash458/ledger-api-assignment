---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: enforce-container-security
spec:
  validationFailureAction: Enforce
  rules:
    - name: disallow-root-user
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Containers must run as non-root."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Image tag ':latest' is prohibited. Use an explicit version tag."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
 

