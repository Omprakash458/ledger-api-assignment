apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger-api
  template:
    metadata:
      labels:
        app: ledger-api
    spec:
      containers:
        - name: ledger-api
          image: ghcr.io/Omprakash458/ledger-api@sha256:placeholder
          ports:
            - containerPort: 8080
